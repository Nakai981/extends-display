function dismissOverlays(){overlay?.remove();overlay=null;menu?.remove();menu=null;}
function showOverlay(mode,detail=''){dismissOverlays();overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML=`<div class="overlay-card"><div class="overlay-head"><h2>${mode==='launcher'?'Applications':mode==='overview'?'All windows':mode==='document'?text(detail):'Search'}</h2><button aria-label="Close">×</button></div>${mode==='launcher'||mode==='search'?'<input aria-label="Search apps and sample files" placeholder="Apps, files, websites…">':''}<div class="overlay-results"></div></div>`;document.body.append(overlay);$('.overlay-head button',overlay).onclick=dismissOverlays;overlay.onclick=e=>{if(e.target===overlay)dismissOverlays();};const input=$('input',overlay);function populate(){const result=$('.overlay-results',overlay),q=(input?.value||'').toLowerCase();if(mode==='overview'){result.className='overlay-results overview-grid';result.innerHTML='';windows.forEach(w=>{const b=document.createElement('button');b.className='overview-item';b.innerHTML=icon(apps[w.kind].icon)+`<span>${text(apps[w.kind].name)}${w.minimized?' · Minimized':''}</span>`;b.onclick=()=>{focusWindow(w.id);dismissOverlays();};result.append(b);});if(!windows.size)result.innerHTML='<p class="muted">No windows yet. Open an app from the Dock.</p>';return;}if(mode==='document'){result.innerHTML='<p class="muted" style="line-height:1.8">This is a sample file for reviewing the Files interface. The native app uses PDFKit, Quick Look, and file viewers. This HTML preview does not read your device or computer files.</p>';return;}result.className='overlay-results '+(mode==='launcher'?'launcher-grid':'');result.innerHTML='';Object.entries(apps).filter(([key,a])=>a.name.toLowerCase().includes(q)).forEach(([key,a])=>{const b=document.createElement('button');b.className=mode==='launcher'?'launcher-item':'search-result';b.innerHTML=mode==='launcher'?`<span class="app-tile" style="--app-color:${a.color}">${icon(a.icon)}</span>${a.name}`:icon(a.icon)+`<span>${a.name}<small>Application</small></span>`;b.onclick=()=>openApp(key);result.append(b);});if(mode==='search'&&q)files.filter(f=>f.name.toLowerCase().includes(q)).forEach(file=>{const b=document.createElement('button');b.className='search-result';b.innerHTML=icon(file.icon)+`<span>${text(file.name)}<small>${text(file.place)} · sample file</small></span>`;b.onclick=()=>{dismissOverlays();const w=openApp('files');w.place=file.place;w.selectedFile=file;renderFiles(w);};result.append(b);});if(!result.children.length)result.innerHTML='<p class="empty">No matching apps or sample files</p>';};populate();if(input){input.oninput=populate;input.onkeydown=e=>{if(e.key==='Enter')$('.overlay-results button',overlay)?.click();};setTimeout(()=>input.focus(),0);}}
function showMenu(rows,x,y){dismissOverlays();menu=document.createElement('div');menu.className='menu-popup';rows.forEach(row=>{if(row.separator){menu.append(document.createElement('hr'));return;}const b=document.createElement('button');b.innerHTML=`<span>${text(row.title)}</span><small>${text(row.shortcut||'')}</small>`;b.disabled=row.disabled||false;b.onclick=()=>{dismissOverlays();row.action?.();};menu.append(b);});document.body.append(menu);menu.style.left=Math.max(8,Math.min(x,innerWidth-menu.offsetWidth-8))+'px';menu.style.top=Math.max(38,Math.min(y,innerHeight-menu.offsetHeight-8))+'px';}
function showWindowMenu(w,x,y){showMenu([{title:'Tile Left Half',action:()=>tile(w,false)},{title:'Tile Right Half',action:()=>tile(w,true)},{title:'Fill Desktop',action:()=>{if(!w.maximized)toggleMax(w);}},{title:'Minimize',shortcut:'⌘M',action:()=>minimize(w)},{title:'Close',shortcut:'⌘W',action:()=>closeWindow(w)}],x,y);}
function tile(w,right){if(!w)return;const box=$('#workspace');w.maximized=false;setRect(w,{x:right?box.clientWidth/2+3:6,y:6,width:box.clientWidth/2-9,height:box.clientHeight-12});}
function showDesktop(){const ws=$('#workspace');ws.classList.toggle('revealed');$('#active-app').textContent=ws.classList.contains('revealed')?'Desktop':apps[current()?.kind]?.name||'ExtendDesk';}
function menuRows(section){const w=current();if(section==='app')return[{title:'About ExtendDesk',action:()=>toast('ExtendDesk v0.3 · design preview, not an iOS build')},{title:'System Settings…',shortcut:'⌘,',action:()=>openApp('settings')},{title:'Applications',action:()=>showOverlay('launcher')},{title:'Show Desktop',action:showDesktop}];if(section==='file')return[{title:'New Browser Window',shortcut:'⌘N',action:()=>openApp('browser',true)},{title:'New Note',action:()=>openApp('notes',true)},{title:'New Desktop Folder…',action:()=>newFolder()},{title:'Open Photos',action:()=>openApp('photos')},{title:'Close Window',shortcut:'⌘W',disabled:!w,action:()=>closeWindow(w)}];if(section==='edit')return[{title:'Find in Page…',shortcut:'⌘F',disabled:w?.kind!=='browser',action:()=>$('[data-find]',w.element)?.click()},{title:'Copy Sample File',disabled:w?.kind!=='files'||!w.selectedFile,action:()=>{clipboard={...w.selectedFile};toast('Copied sample file');}},{title:'Paste Sample File',disabled:w?.kind!=='files'||!clipboard,action:()=>$('[data-paste]',w.element)?.click()}];if(section==='window')return[{title:'Tile Left Half',disabled:!w,action:()=>tile(w,false)},{title:'Tile Right Half',disabled:!w,action:()=>tile(w,true)},{title:'Minimize',shortcut:'⌘M',disabled:!w,action:()=>minimize(w)},{title:'All Windows',action:()=>showOverlay('overview')}];if(section==='view')return[{title:'All Windows',action:()=>showOverlay('overview')},{title:'Show Desktop',action:showDesktop},{title:'Toggle Light / Dark',action:()=>{preferences.theme=preferences.theme==='dark'?'light':'dark';applyPreferences();}},{title:(preferences.autoHide?'✓ ':'')+'Automatically Hide Dock',action:()=>{preferences.autoHide=!preferences.autoHide;applyPreferences();}}];if(section==='help')return[{title:'Keyboard Shortcuts',action:()=>toast('Ctrl/⌘ + Space Search · N Browser · T Tab · M Minimize · W Close · , Settings')},{title:'Preview Information',action:()=>toast('Everything runs locally. Sample data only. No network or native iOS runtime.')}];return[{title:'Light Appearance',action:()=>{preferences.theme='light';applyPreferences();}},{title:'Dark Appearance',action:()=>{preferences.theme='dark';applyPreferences();}},{title:(preferences.reduceMotion?'✓ ':'')+'Reduce Motion',action:()=>{preferences.reduceMotion=!preferences.reduceMotion;applyPreferences();}},{title:'System Settings…',action:()=>openApp('settings')}];}
$$('[data-menu]').forEach(b=>b.onclick=()=>{const r=b.getBoundingClientRect();showMenu(menuRows(b.dataset.menu),r.left,r.bottom+4);});$('#search-button').onclick=()=>showOverlay('search');$('#theme-button').onclick=()=>{preferences.theme=preferences.theme==='dark'?'light':'dark';applyPreferences();};$('#control-button').onclick=e=>showMenu(menuRows('control'),e.currentTarget.getBoundingClientRect().left,38);$$('[data-open]').forEach(b=>b.ondblclick=()=>openApp(b.dataset.open));$('#workspace').oncontextmenu=e=>{if(e.target.closest('.window')||e.target.closest('.desktop-icon'))return;e.preventDefault();showMenu([{title:'New Folder…',action:()=>newFolder()},{title:'Show Desktop',action:showDesktop},{title:'Change Wallpaper…',action:()=>openApp('settings')}],e.clientX,e.clientY);};document.addEventListener('pointerdown',e=>{if(menu&&!e.target.closest('.menu-popup')&&!e.target.closest('[data-menu]')&&!e.target.closest('#control-button')){menu.remove();menu=null;}});$('#dock-zone').onpointerenter=()=>$('#dock').classList.add('reveal');$('#dock').onpointerleave=()=>$('#dock').classList.remove('reveal');document.addEventListener('visibilitychange',()=>{if(document.hidden)windows.forEach(stopSlideshow);});window.addEventListener('resize',()=>{windows.forEach(w=>{if(w.maximized){const box=$('#workspace');setRect(w,{x:8,y:8,width:box.clientWidth-16,height:box.clientHeight-16});}else setRect(w,rect(w));});});document.addEventListener('keydown',e=>{if(e.key==='Escape'){dismissOverlays();return;}const mod=e.ctrlKey||e.metaKey;if(!mod)return;const key=e.key.toLowerCase(),w=current();if(e.code==='Space'){e.preventDefault();showOverlay('search');}else if(key==='n'){e.preventDefault();openApp('browser',true);}else if(key===','){e.preventDefault();openApp('settings');}else if(key==='m'&&w){e.preventDefault();minimize(w);}else if(key==='w'&&w){e.preventDefault();closeWindow(w);}else if(key==='t'){e.preventDefault();if(w?.kind==='browser')$('[data-newtab]',w.element).click();else openApp('browser');}else if(key==='f'&&w?.kind==='browser'){e.preventDefault();$('[data-find]',w.element).click();}else if(key==='d'&&e.shiftKey){e.preventDefault();showDesktop();}});
function updateClock(){const date=new Date();$('#clock').textContent=new Intl.DateTimeFormat('en',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(date);}
applyPreferences();updateClock();setInterval(updateClock,30000);openApp('files');openApp('browser');
</script>
